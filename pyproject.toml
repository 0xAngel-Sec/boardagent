[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmanager"
version = "0.1.0"
description = "Local-first, agent-first task manager"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "TaskManager contributors"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.133.1",
    "uvicorn>=0.41.0",
    "pydantic>=2.13.4",
    "textual>=8.2.8",
    "httpx>=0.27.0",
    "mcp",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-anyio",
]

[project.scripts]
taskmanager-server = "taskmanager.api:main"
taskmanager = "taskmanager.tui:main"
taskmanager-mcp = "taskmanager.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["taskmanager*"]

[tool.setuptools.package-data]
taskmanager = ["themes/*.json", "themes/schema.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
