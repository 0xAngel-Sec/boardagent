openapi: 3.1.0
info:
  title: TaskManager API
  description: Agent-first local task manager REST API.
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Healthz'
  /tasks:
    post:
      summary: Create Task
      operationId: create_task_tasks_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      summary: List Tasks
      operationId: list_tasks_tasks_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Status'
          - type: 'null'
          title: Status
      - name: project
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Project
      - name: owner
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/{task_id}:
    get:
      summary: Get Task
      operationId: get_task_tasks__task_id__get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      summary: Update Task
      operationId: update_task_tasks__task_id__patch
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Task
      operationId: delete_task_tasks__task_id__delete
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
          title: Task Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/{task_id}/claim:
    post:
      summary: Claim Task
      operationId: claim_task_tasks__task_id__claim_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskClaim'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/{task_id}/complete:
    post:
      summary: Complete Task
      operationId: complete_task_tasks__task_id__complete_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: integer
          title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskComplete'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /tasks/schema/priority:
    get:
      summary: Priority Values
      operationId: priority_values_tasks_schema_priority_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response Priority Values Tasks Schema Priority Get
  /tasks/schema/status:
    get:
      summary: Status Values
      operationId: status_values_tasks_schema_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
                title: Response Status Values Tasks Schema Status Get
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Healthz:
      properties:
        status:
          type: string
          title: Status
        version:
          type: string
          title: Version
      type: object
      required:
      - status
      - version
      title: Healthz
    Priority:
      type: string
      enum:
      - red
      - orange
      - yellow
      - green
      - blue
      - white
      title: Priority
    Status:
      type: string
      enum:
      - todo
      - in_progress
      - blocked
      - done
      title: Status
    Task:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        due:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Due
        priority:
          $ref: '#/components/schemas/Priority'
          default: white
        project:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Project
        status:
          $ref: '#/components/schemas/Status'
          default: todo
        id:
          type: integer
          title: Id
        owner_agent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Agent Id
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - title
      - id
      - created_at
      - updated_at
      title: Task
    TaskClaim:
      properties:
        agent_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Agent Id
      type: object
      required:
      - agent_id
      title: TaskClaim
    TaskComplete:
      properties:
        agent_id:
          type: string
          maxLength: 100
          minLength: 1
          title: Agent Id
      type: object
      required:
      - agent_id
      title: TaskComplete
    TaskCreate:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        due:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Due
        priority:
          $ref: '#/components/schemas/Priority'
          default: white
        project:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Project
        status:
          $ref: '#/components/schemas/Status'
          default: todo
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        agent_id:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Agent Id
      type: object
      required:
      - title
      title: TaskCreate
    TaskList:
      properties:
        tasks:
          items:
            $ref: '#/components/schemas/Task'
          type: array
          title: Tasks
        count:
          type: integer
          title: Count
      type: object
      required:
      - tasks
      - count
      title: TaskList
    TaskUpdate:
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        due:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Due
        priority:
          anyOf:
          - $ref: '#/components/schemas/Priority'
          - type: 'null'
        project:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Project
        status:
          anyOf:
          - $ref: '#/components/schemas/Status'
          - type: 'null'
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
        agent_id:
          anyOf:
          - type: string
            maxLength: 100
          - type: 'null'
          title: Agent Id
      additionalProperties: false
      type: object
      title: TaskUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
